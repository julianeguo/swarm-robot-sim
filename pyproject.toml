[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-robot-sim"
version = "0.1.0"
description = "Decentralized multi-agent RL for 2D lattice swarm self-reconfiguration"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Installed at the milestone that first needs them, not before.
rl = ["torch>=2.2", "gymnasium>=0.29", "pettingzoo>=1.24", "tensorboard>=2.16"]
viz = ["pygame>=2.5", "imageio>=2.34"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
