# Baseline configuration. Experiment configs should set `inherits: default.yaml`
# and override only what they change.
seed: 0

grid:
  height: 24
  width: 24

episode:
  n_modules: 16
  max_steps: 200
  # K: the target shape is the start shape after this many random legal moves, one robot
  # per move. Guarantees the episode is solvable and acts as the difficulty dial.
  target_walk_steps: 8
  # Each episode starts from one of these (names from shapes.SHAPE_NAMES), picked at random.
  start_shapes: [circle, rectangle, star]
  # Local movement rules that keep the swarm in one piece (see sim.py). Off = the old rules,
  # where the swarm splits apart and freezes within a few dozen steps.
  keep_connected: true
  # End the episode (as a failure) when no robot can move; see reward.freeze_penalty.
  end_on_freeze: true

reward:
  name: team_fill
  fill_scale: 1.0          # delta(filled targets) * fill_scale / n_modules
  time_cost_total: 0.5     # per-step penalty is this divided by max_steps
  completion_bonus: 1.0
  isolation_penalty: 0.0   # per-step penalty is this * (robots with no neighbours) / n_modules
  freeze_penalty: 0.5      # on a freeze: this + the time cost of the steps left

curriculum:
  enabled: false
  # Reverse curriculum (see env.py): each episode starts `level` moves before the end of the
  # random walk that made the target. Levels above target_walk_steps are dropped.
  type: reverse
  levels: [1, 2, 4, 8]
  promote_success_rate: 0.8   # over the last window_episodes episodes at the current level
  window_episodes: 100
  replay_easier: 0.2          # fraction of episodes replayed at an earlier level

train: {}   # left untyped until the PPO milestone
